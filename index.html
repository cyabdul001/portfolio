<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Security Engineer — Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0E0B1A;
    --panel:rgba(255,255,255,0.06);
    --line:rgba(255,255,255,0.12);
    --text:#F3F1FA;
    --dim:#A79FC2;
    --p1:#7C4DFF; --p2:#FF5DA2; --p3:#22D3EE;
    --mono:'JetBrains Mono', monospace;
    --sans:'Sora', sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(124,77,255,.35), transparent 60%),
      radial-gradient(ellipse 800px 500px at 100% 10%, rgba(255,93,162,.25), transparent 60%),
      radial-gradient(ellipse 700px 500px at 50% 100%, rgba(34,211,238,.18), transparent 60%),
      var(--bg);
    color:var(--text); font-family:var(--sans); line-height:1.6;
  }
  a{color:var(--p3); text-decoration:none;}
  .wrap{max-width:940px; margin:0 auto; padding:0 24px;}

  nav{position:sticky; top:0; z-index:10; background:rgba(14,11,26,0.6); backdrop-filter:blur(16px); border-bottom:1px solid var(--line);}
  nav .wrap{display:flex; justify-content:space-between; align-items:center; height:62px;}
  .brand{font-weight:800; font-size:15px;}
  nav .links{display:flex; gap:26px; font-size:13.5px; font-weight:500;}
  nav .links a{color:var(--dim);}
  nav .links a:hover{color:var(--text);}

  header.hero{padding:100px 0 60px;}
  .eyebrow{
    display:inline-flex; align-items:center; gap:8px; font-family:var(--mono); font-size:12px;
    background:var(--panel); backdrop-filter:blur(10px); border:1px solid var(--line);
    padding:7px 16px; border-radius:100px; margin-bottom:26px;
  }
  .eyebrow .dot{width:6px; height:6px; border-radius:50%; background:var(--p3); box-shadow:0 0 8px var(--p3);}
  h1{
    font-size:clamp(32px,5.2vw,50px); font-weight:800; letter-spacing:-0.02em;
    max-width:720px; margin-bottom:20px; line-height:1.1;
  }
  h1 .grad{background:linear-gradient(90deg,var(--p1),var(--p2),var(--p3)); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .hero p.sub{color:var(--dim); max-width:540px; font-size:16px; margin-bottom:32px;}
  .ctas{display:flex; gap:14px; flex-wrap:wrap;}
